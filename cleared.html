<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quest Cleared · Larp Leveling</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#03060E">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--void:#03060E;--blue:#46A6FF;--ice:#A6DAFF;--silver:#F2F8FF;--dim:#7F9CC8;--cc:#46A6FF;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--void);color:var(--silver);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px max(20px,env(safe-area-inset-left,0px));background:radial-gradient(ellipse at 50% 35%,color-mix(in srgb,var(--cc) 30%,#0A1A3C) 0%,#06122B 40%,var(--void) 75%)}
.flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 40%,rgba(166,218,255,.7),transparent 60%);animation:flash 1.1s ease-out forwards}
.box{position:relative;width:100%;max-width:520px;border:1px solid var(--cc);background:rgba(8,18,40,.85);box-shadow:0 0 50px color-mix(in srgb,var(--cc) 45%,transparent);padding:40px 24px 32px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;animation:pop .7s cubic-bezier(.2,.9,.2,1) both}
.box::before,.box::after{content:"";position:absolute;width:24px;height:24px;border:0 solid var(--cc)}
.box::before{top:6px;left:6px;border-top-width:3px;border-left-width:3px}
.box::after{bottom:6px;right:6px;border-bottom-width:3px;border-right-width:3px}
.sys{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ice)}
img{width:120px;height:120px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.6));animation:spin .9s .2s cubic-bezier(.2,.9,.2,1) both}
h1{margin:0;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:clamp(34px,9vw,52px);line-height:1;text-transform:uppercase;letter-spacing:1px;text-shadow:0 0 26px color-mix(in srgb,var(--cc) 80%,transparent)}
.xp{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:26px;color:var(--cc)}
p{margin:0;font-size:16px;line-height:1.6;color:#C6D8F2;max-width:400px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;background:var(--blue);color:#02101F;font-family:'Chakra Petch',sans-serif;font-weight:700;letter-spacing:2px;text-transform:uppercase;text-decoration:none}
.btn:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
.fine{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim)}
@keyframes flash{from{opacity:1}to{opacity:0}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{from{transform:scale(.3) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="flash" aria-hidden="true"></div>
<main class="box">
<span class="sys">[ SYSTEM ] Quest status updated.</span>
<img id="emb" src="/badges/side-character.png" alt="" width="120" height="120">
<h1>Quest Cleared</h1>
<span class="xp" id="cls">+50 XP</span>
<p>Badly still counts. Post proof in the Discord's quest-cleared channel for double XP.</p>
<a class="btn" href="https://discord.gg/zf7WzBDRE7">Post your proof</a>
<span class="fine">See you on tomorrow's board.</span>
</main>
<script>
(function(){
var C={founder:['Founder','#6FA8FF'],athlete:['Athlete','#FF8A3D'],influencer:['Influencer','#7CFF4F'],artist:['Artist','#FFD400'],charmer:['Charmer','#E04A64'],scholar:['Scholar','#A9A3FF'],monk:['Monk','#FF6A4D']};
var k=(new URLSearchParams(location.search).get('c')||'').toLowerCase();
if(C[k]){ document.getElementById('emb').src='/badges/class-'+k+'.png'; document.getElementById('cls').textContent=C[k][0]+' · +50 XP'; document.documentElement.style.setProperty('--cc',C[k][1]); }
})();
</script>
</body>
</html>
